services:
  web:
    image: documents-viewer:latest
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "${GID:-1002}"
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      LIBRARY_DIR: /library
    volumes:
      - /data/rag/ocr-output:/library:ro
